<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntennaController</title>
<style>:root{color-scheme:dark;--bg:#0f1216;--card:#1a2028;--line:#343d49;--text:#edf2f7;--muted:#a7b1bd;--blue:#347fc4;--green:#2c9b58;--red:#b34444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:18px}main{max-width:760px;margin:auto}h1{margin-bottom:4px}.sub{color:var(--muted);margin-top:0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.network{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px;border-bottom:1px solid var(--line)}.network:last-child{border-bottom:0}.ssid{font-weight:700}.meta{color:var(--muted);font-size:.9rem}button{border:0;border-radius:9px;padding:10px 13px;background:var(--blue);color:white;font-weight:650;cursor:pointer}button.secondary{background:#39424e}button.danger{background:var(--red)}input{width:100%;padding:11px;border:1px solid #4a5563;background:#10151b;color:white;border-radius:8px;font-size:16px}label{display:block;margin:11px 0 4px;color:var(--muted)}#status{margin-top:10px;min-height:1.5em}.good{color:#6ce39a}.bad{color:#ff8b8b}.spinner{opacity:.75}.lang{float:right}@media(max-width:600px){.network{align-items:flex-start;flex-direction:column}.network .row{width:100%}.network button{flex:1}}</style></head>
<body><main><div class="lang"><button id=de class=secondary>DE</button> <button id=en class=secondary>EN</button></div><h1>AntennaController</h1><p id=sub class=sub></p>
<div class=card><div class=row><h2 id=foundTitle style="margin:0;flex:1"></h2><button id=scan></button></div><div id=found class=spinner></div></div>
<div class=card><h2 id=addTitle></h2><label id=ssidLabel></label><input id=ssid maxlength=32 autocomplete=off><label id=passLabel></label><input id=password type=password maxlength=63 autocomplete=new-password><div class=row><button id=add></button></div><div id=status></div><p id=addHelp class=meta></p></div>
<div class=card><h2 id=savedTitle></h2><p id=savedHelp class=meta></p><div id=saved></div></div>
<div class=card><b id=reopenTitle></b><p id=reopenHelp class=meta></p></div></main>
<script>
const $=s=>document.querySelector(s);let L=localStorage.getItem("aclang") || ((navigator.language||"de").toLowerCase().startsWith("en") ? "en" : "de");
const T={de:{sub:"WLAN-Einrichtung / Wiederherstellung · kein PC und keine Anwendung erforderlich",found:"Gefundene WLANs",scan:"Neu suchen",search:"Suche…",none:"Keine WLANs gefunden.",secure:"gesichert",open:"offen",choose:"Auswählen",add:"WLAN hinzufügen",ssid:"WLAN-Name (SSID)",pass:"Passwort",test:"Verbindung testen & hinzufügen",help:"Das neue WLAN wird zuerst real getestet. Nur bei erfolgreicher Verbindung wird es gespeichert und das Steuergerät startet neu. Maximal 5 WLANs.",saved:"Gespeicherte WLANs",savedHelp:"Reihenfolge = Priorität. Das Steuergerät versucht beim Start das oberste erreichbare Netz zuerst.",load:"Lade…",pw:"Passwort gespeichert",openNet:"offenes Netz",del:"Löschen",empty:"Noch kein WLAN gespeichert.",delAsk:"Dieses WLAN wirklich löschen?",ssidMissing:"SSID fehlt.",testing:"Teste reale WLAN-Verbindung…",success:"Verbindung erfolgreich. WLAN gespeichert. Steuergerät startet neu…",reopen:"Einrichtungsmodus erneut aufrufen:",reopenHelp:"Im Normalbetrieb die BOOT-Taste am ESP32 etwa 3 Sekunden gedrückt halten. Das Steuergerät startet dann mit einem eigenen WLAN-Zugangspunkt neu."},en:{sub:"Wi-Fi setup / recovery · no PC and no app required",found:"Detected Wi-Fi networks",scan:"Scan again",search:"Scanning…",none:"No Wi-Fi networks found.",secure:"secured",open:"open",choose:"Select",add:"Add Wi-Fi",ssid:"Wi-Fi name (SSID)",pass:"Password",test:"Test connection & add",help:"The new Wi-Fi network is tested first. It is saved only after a successful connection, then the controller restarts. Maximum 5 networks.",saved:"Stored Wi-Fi networks",savedHelp:"Order = priority. On startup the controller tries the highest reachable network first.",load:"Loading…",pw:"Password stored",openNet:"open network",del:"Delete",empty:"No Wi-Fi network stored yet.",delAsk:"Really delete this Wi-Fi network?",ssidMissing:"SSID is missing.",testing:"Testing real Wi-Fi connection…",success:"Connection successful. Wi-Fi saved. Controller is restarting…",reopen:"Open setup mode again:",reopenHelp:"During normal operation hold the ESP32 BOOT button for about 3 seconds. The controller then restarts as its own access point."}};
function tr(k){return T[L][k]}function apply(){document.documentElement.lang=L;document.title=L==="en"?"AntennaController · Wi-Fi setup":"AntennaController · WLAN-Einrichtung";$("#sub").textContent=tr("sub");$("#foundTitle").textContent=tr("found");$("#scan").textContent=tr("scan");$("#addTitle").textContent=tr("add");$("#ssidLabel").textContent=tr("ssid");$("#passLabel").textContent=tr("pass");$("#add").textContent=tr("test");$("#addHelp").textContent=tr("help");$("#savedTitle").textContent=tr("saved");$("#savedHelp").textContent=tr("savedHelp");$("#reopenTitle").textContent=tr("reopen");$("#reopenHelp").textContent=tr("reopenHelp");scan();saved()}$("#de").onclick=()=>{L="de";localStorage.setItem("aclang",L);apply()};$("#en").onclick=()=>{L="en";localStorage.setItem("aclang",L);apply()};
async function api(url,opt={}){let r=await fetch(url,opt),t=await r.text(),j=t?JSON.parse(t):{};if(!r.ok)throw Error(j.error||t||`HTTP ${r.status}`);return j}async function post(url,obj){return api(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)})}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function scan(){let h=$("#found");h.className="spinner";h.textContent=tr("search");try{let a=await api("/setup/scan");h.className="";h.innerHTML=a.length?a.map(n=>`<div class=network><div><div class=ssid>${esc(n.ssid)}</div><div class=meta>${n.rssi} dBm · ${n.secure?tr("secure"):tr("open")}</div></div><button data-ssid="${esc(n.ssid)}">${tr("choose")}</button></div>`).join(""):tr("none");h.querySelectorAll("button").forEach(b=>b.onclick=()=>{$("#ssid").value=b.dataset.ssid;$("#password").focus()})}catch(e){h.className="bad";h.textContent=L==="en"?"Wi-Fi scan failed.":e.message}}
async function saved(){try{let a=await api("/setup/saved");$("#saved").innerHTML=a.length?a.map((n,i)=>`<div class=network><div><div class=ssid>${i+1}. ${esc(n.ssid)}</div><div class=meta>${n.hasPassword?tr("pw"):tr("openNet")}</div></div><div class=row><button class=secondary data-up="${i}" ${i===0?"disabled":""}>↑</button><button class=secondary data-down="${i}" ${i===a.length-1?"disabled":""}>↓</button><button class=danger data-del="${i}">${tr("del")}</button></div></div>`).join(""):tr("empty");$("#saved").querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));$("#saved").querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>move(+b.dataset.down,1));$("#saved").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(+b.dataset.del))}catch(e){$("#saved").innerHTML=`<span class=bad>${esc(e.message)}</span>`}}
async function move(index,direction){try{await post("/setup/move",{index,direction,language:L});saved()}catch(e){alert(L==="en"?"Operation failed.":e.message)}}async function del(index){if(!confirm(tr("delAsk")))return;try{await post("/setup/delete",{index,language:L});saved()}catch(e){alert(L==="en"?"Operation failed.":e.message)}}
$("#scan").onclick=scan;$("#add").onclick=async()=>{let ssid=$("#ssid").value.trim(),password=$("#password").value,st=$("#status");if(!ssid){st.className="bad";st.textContent=tr("ssidMissing");return}st.className="spinner";st.textContent=tr("testing");$("#add").disabled=true;try{await post("/setup/add",{ssid,password,language:L});st.className="good";st.textContent=tr("success")}catch(e){st.className="bad";st.textContent=L==="en"?"Connection failed. Check SSID, password and 2.4 GHz availability.":e.message;$("#add").disabled=false}};apply();
</script></body></html>
